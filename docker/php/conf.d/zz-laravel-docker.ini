; Développement sous Docker (php artisan serve = SAPI « cli » / built-in server).
; Sans opcache.enable_cli=1, chaque requête re-parse tout vendor/ → 10–60 s par hit sur volume Windows.

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=64
opcache.max_accelerated_files=50000

; Revalider les timestamps toutes les 5s au lieu de 1s.
; Sur un bind-mount Windows, chaque stat() est coûteux. 5s est un bon compromis dev.
opcache.validate_timestamps=1
opcache.revalidate_freq=5

; Précharger les fichiers compilés dans la mémoire partagée (JIT-friendly)
opcache.save_comments=1
opcache.fast_shutdown=1

; Réduit les allers-retours disque pour realpath() (bind-mount Docker Desktop)
realpath_cache_size=4096K
realpath_cache_ttl=600

; Buffers de sortie plus grands pour réduire les write() syscalls
output_buffering=4096
